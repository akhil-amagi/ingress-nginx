# Fork-only workflow: builds the ingress-nginx controller image on top of
# this fork's custom nginx base image (NGINX_BASE) and pushes it to
# venkatkasi/ingress-nginx-controller on Docker Hub.

name: Build Controller (fork)

on:
  push:
    branches:
      - main
    paths:
      - 'NGINX_BASE'
      - 'rootfs/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-controller-fork.yaml'

jobs:
  build-controller:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get go version
        run: echo "GOLANG_VERSION=$(cat GOLANG_VERSION)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true

      - name: Build controller binaries
        env:
          PKG: k8s.io/ingress-nginx
          ARCH: amd64
          TAG: "1.31.9"
        run: |
          export COMMIT_SHA="git-$(git rev-parse --short HEAD)"
          export REPO_INFO="$(git config --get remote.origin.url)"
          sh build/build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: latest

      - name: Login to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push controller image
        run: |
          export BASE_IMAGE=$(cat NGINX_BASE)
          export COMMIT_SHA="git-$(git rev-parse --short HEAD)"
          docker buildx build \
            --platform=linux/amd64 \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg VERSION="1.31.9" \
            --build-arg TARGETARCH="amd64" \
            --build-arg COMMIT_SHA="${COMMIT_SHA}" \
            --push \
            -t venkatkasi/ingress-nginx-controller:1.31.9 \
            rootfs
